<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gold-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.35" stop-color="#f7dc94"/>
      <stop offset="0.7" stop-color="#e8b84a"/>
      <stop offset="1" stop-color="#b8862b"/>
    </linearGradient>
  </defs>
</svg>
<div id="app"></div>
<div id="sheet" hidden></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px;text-align:center">Noor needs JavaScript to keep your streak.</p></noscript>
