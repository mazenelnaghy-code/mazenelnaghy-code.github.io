<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { --navy: #14213D; --amber: #FFC42E; --paper: #F4F4F2; --night: #0A1120; --mist: #A7B1C4; --dim: #7D89A3; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid; grid-template-rows: auto 1fr auto;

  a { color: inherit; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  header, footer { padding: 24px clamp(20px, 5vw, 60px); }
  .mark { display: inline-block; width: 44px; height: 36px; color: var(--paper); }
  main { display: grid; place-items: center; padding: 20px clamp(20px, 5vw, 60px); }
  .frame { position: relative; width: min(760px, 100%); padding: clamp(28px, 6vw, 64px); }
  .frame::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    --c: var(--amber); --l: 26px; --t: 2px;
    background:
      linear-gradient(var(--c) 0 0) 0 0 / var(--l) var(--t) no-repeat,
      linear-gradient(var(--c) 0 0) 0 0 / var(--t) var(--l) no-repeat,
      linear-gradient(var(--c) 0 0) 100% 0 / var(--l) var(--t) no-repeat,
      linear-gradient(var(--c) 0 0) 100% 0 / var(--t) var(--l) no-repeat,
      linear-gradient(var(--c) 0 0) 0 100% / var(--l) var(--t) no-repeat,
      linear-gradient(var(--c) 0 0) 0 100% / var(--t) var(--l) no-repeat,
      linear-gradient(var(--c) 0 0) 100% 100% / var(--l) var(--t) no-repeat,
      linear-gradient(var(--c) 0 0) 100% 100% / var(--t) var(--l) no-repeat;
  }
  .tag { position: absolute; left: 0; top: 0; transform: translateY(-100%); padding: 4px 8px 3px; background: var(--amber); color: var(--navy); font-size: 11px; letter-spacing: .06em; }
  .code {
    margin: 0 0 6px;
    color: var(--paper);
    font: 700 clamp(120px, 26vw, 220px)/.8 "Barlow Condensed", "Arial Narrow", sans-serif;
    letter-spacing: -.01em;
  }
  .dot { display: inline-block; width: .16em; height: .16em; margin-left: .04em; border-radius: 50%; background: var(--amber); }
  h1 { margin: 18px 0 10px; font: 700 clamp(30px, 5vw, 46px)/1 "Barlow Condensed", "Arial Narrow", sans-serif; text-transform: uppercase; }
  p { margin: 0 0 22px; color: var(--mist); max-width: 46ch; }
  .predict { font-size: 13px; color: var(--dim); overflow-wrap: anywhere; }
  .predict b { color: var(--amber); font-weight: 500; white-space: nowrap; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }
  .btn {
    display: inline-flex; align-items: center; min-height: 50px; padding: 0 22px;
    border: 1px solid #34466B;
    font: 500 12px/1 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase;
    text-decoration: none;
  }
  .btn-amber { background: var(--amber); border-color: var(--amber); color: var(--navy); }
  .btn:hover { border-color: var(--amber); }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
  footer { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
